<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your Bite For Less reservations and account." />
  <title>My Dashboard | Bite For Less</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="hero hero-slim">
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">Customer dashboard</span>
          <h1 id="dashTitle">My reservations</h1>
        </div>
      </div>
    </section>
    <div class="container section" style="padding-top:1.5rem">
      <div class="dash-grid">
        <nav class="dash-nav" aria-label="Dashboard">
          <a href="customer.html" aria-current="page">Overview</a>
          <a href="/deals.html">Browse deals</a>
          <a href="/index.html">Home</a>
        </nav>
        <div>
          <div class="stat-grid" id="statGrid"></div>
          <section class="panel" aria-labelledby="currentH">
            <h3 id="currentH">Current reservations</h3>
            <div id="currentList"></div>
          </section>
          <section class="panel" aria-labelledby="historyH">
            <h3 id="historyH">History</h3>
            <div id="historyList"></div>
          </section>
          <section class="panel" aria-labelledby="profileH">
            <h3 id="profileH">Profile</h3>
            <div id="profileBox"></div>
          </section>
          <section class="panel" aria-labelledby="savedH">
            <h3 id="savedH">Saved deals</h3>
            <div class="empty">Saved deals are not supported by the current backend — browse <a href="/deals.html">live deals</a> instead.</div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/dash-customer.js"></script>
</body>
</html>
