<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to Bite For Less." />
  <title>Log In | Bite For Less</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="hero hero-slim">
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">Welcome back</span>
          <h1>Log in</h1>
          <p class="lead">One login for everyone — you are taken to the right dashboard automatically.</p>
        </div>
      </div>
    </section>
    <div class="container section" style="padding-top:1.5rem">
      <div class="auth-wrap">
        <form class="form-card" id="loginForm" aria-label="Log in">
          <div class="form-grid">
            <label class="field">Email<input type="email" name="email" required autocomplete="email" maxlength="120" /></label>
            <label class="field">Password<input type="password" name="password" required autocomplete="current-password" minlength="6" /></label>
            <div><button class="btn btn-primary" type="submit" style="width:100%">Log in</button></div>
            <div class="status" id="loginStatus" role="status"></div>
            <p class="small muted">New here? <a href="/signup.html">Create an account</a>.</p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
