<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a Bite For Less customer account." />
  <title>Sign Up | Bite For Less</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="hero hero-slim">
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">Join us</span>
          <h1>Create your account</h1>
          <p class="lead">New accounts start as customers. Vendor access follows partner approval.</p>
        </div>
      </div>
    </section>
    <div class="container section" style="padding-top:1.5rem">
      <div class="auth-wrap">
        <form class="form-card" id="signupForm" aria-label="Sign up">
          <div class="form-grid">
            <label class="field">Full name<input name="name" required autocomplete="name" maxlength="80" /></label>
            <label class="field">Email<input type="email" name="email" required autocomplete="email" maxlength="120" /></label>
            <label class="field">Phone<input type="tel" name="phone" required autocomplete="tel" maxlength="30" /></label>
            <label class="field">Password (min 6 characters)<input type="password" name="password" required autocomplete="new-password" minlength="6" /></label>
            <div><button class="btn btn-primary" type="submit" style="width:100%">Create account</button></div>
            <div class="status" id="signupStatus" role="status"></div>
            <p class="small muted">Already have an account? <a href="/login.html">Log in</a>.</p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
