<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Deal details and reservation." />
  <title>Deal Details | Bite For Less</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="container section">
      <a class="btn btn-ghost btn-sm" href="/deals.html">← Back to deals</a>
      <div id="dealDetail" class="mt"></div>
    </div>
  </main>

  <div class="modal" id="reserveModal" hidden role="dialog" aria-label="Reservation confirmation">
    <div class="modal-card">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <span class="eyebrow">Reservation confirmed</span>
      <h3 id="resTitle">Pickup details</h3>
      <div id="resBody"></div>
      <div class="qr-box" id="qrBox"></div>
      <button class="btn btn-primary" type="button" data-close>Done</button>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/deal-page.js"></script>
</body>
</html>
